<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Castle Cascade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Castle Cascade. One look on purpose: a royal night sky, parchment panels
   with gold trim, and chunky candy buttons. Layout: a single phone-width
   column; home stacks kingdom > widgets > play, the game screen is a
   full-bleed canvas with the HUD and booster bar floating over it. */
:root {
  color-scheme: dark;
  --night: #12153f;
  --night-hi: #2d3391;
  --sky-glow: #4b4fc4;
  --panel: #fff3d6;
  --panel-edge: #e7b955;
  --ink: #3a1d52;
  --ink-soft: #6b4f7a;
  --cream: #fff6e3;
  --muted: #c3c6f0;
  --gold: #ffcf3f;
  --gold-deep: #b97c00;
  --leaf: #55c736;
  --leaf-deep: #2b7a1a;
  --velvet: #8a3cc4;
  --velvet-deep: #4f1878;
  --ruby: #ec3a52;
  --ruby-deep: #8e1023;
  --glass: rgba(10, 12, 48, 0.55);
  --font-display: "Lilita One", "Arial Black", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}

html { height: 100%; box-sizing: border-box; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  color: var(--cream);
  font-family: var(--font-body);
  font-weight: 800;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.8) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, rgba(255,255,255,.7) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 32%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 41%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 24%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(120% 70% at 50% 0%, var(--sky-glow) 0%, var(--night-hi) 38%, var(--night) 100%);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#app {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

.ic { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; flex: none; }
.ic.xs { width: 14px; height: 14px; }
.ic.sm { width: 18px; height: 18px; }
.ic.md { width: 30px; height: 30px; }
.ic.lg { width: 40px; height: 40px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 8px; padding-block: 10px 6px; }
.pill {
  display: flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px 0 6px;
  border-radius: 18px;
  background: var(--glass);
  box-shadow: inset 0 0 0 2px rgba(255, 207, 63, 0.35);
  font-variant-numeric: tabular-nums;
  min-width: 0;
}
.pill b { font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: 0.02em; }
.pill small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.roundbtn {
  margin-left: auto; width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(var(--velvet), var(--velvet-deep));
  box-shadow: 0 3px 0 #2c0b47, inset 0 2px 0 rgba(255,255,255,.25);
}
.roundbtn svg { width: 22px; height: 22px; }
.roundbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2c0b47; }

/* ---------- kingdom ---------- */
.kingdom { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-block: 4px 8px; }
.areahead { text-align: center; }
.areahead h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(26px, 7vw, 34px); letter-spacing: 0.02em; color: var(--gold);
  text-shadow: 0 3px 0 var(--velvet-deep), 0 0 18px rgba(255, 207, 63, 0.35);
  text-wrap: balance;
}
.areahead p { margin: 2px 0 6px; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.bar { position: relative; height: 14px; border-radius: 8px; background: rgba(0,0,0,.35); overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 8px; background: linear-gradient(#ffe680, var(--gold) 60%, #e39b00); transition: width .8s cubic-bezier(.2,.9,.3,1.2); }
.bar span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 14px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.6); }
.bar.thin { height: 8px; max-width: 220px; margin: 0 auto; }
.bar.big { height: 22px; margin: 6px 0 14px; }
.bar.big span { line-height: 22px; font-size: 13px; }
.bar.mini { height: 6px; width: 64px; display: block; }

.scene {
  --wall: #5a2a85; --floor: #7a4a26;
  position: relative; flex: 1; min-height: 190px;
  border-radius: 22px; overflow: hidden;
  background:
    radial-gradient(40% 32% at 50% 30%, rgba(255, 236, 170, 0.28), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 64px) 0 100% / 100% 36% no-repeat,
    linear-gradient(to bottom, color-mix(in srgb, var(--wall) 75%, #fff 25%) 0%, var(--wall) 62%, var(--floor) 62%, color-mix(in srgb, var(--floor) 70%, #000 30%) 100%);
  box-shadow: inset 0 0 0 3px rgba(255, 207, 63, 0.55), inset 0 -30px 60px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
}
.scene::before {
  content: ""; position: absolute; left: 50%; top: 9%; width: 26%; aspect-ratio: 3 / 4; translate: -50% 0;
  border-radius: 50% 50% 8px 8px / 38% 38% 8px 8px;
  background: linear-gradient(#9fd2ff, #4c7bd8 70%, #2d4c9a);
  box-shadow: inset 0 0 0 5px rgba(60, 30, 10, .55), 0 0 30px rgba(160, 210, 255, .35);
  opacity: .9;
}
.item { position: absolute; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.item .emo { font-size: clamp(32px, 10vw, 52px); line-height: 1; filter: drop-shadow(0 4px 2px rgba(0,0,0,.35)); }
.item .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: rgba(20, 10, 40, .6); color: var(--cream); white-space: nowrap; }
.item.todo .emo { filter: grayscale(1) brightness(.15); opacity: .35; }
.item.todo .tag { opacity: .7; }
.item.next .emo { filter: grayscale(1) brightness(.2); opacity: .5; }
.item.next::before {
  content: ""; position: absolute; inset: -10px -14px 12px; border-radius: 50%;
  border: 3px dashed rgba(255, 220, 120, .85); animation: spin 9s linear infinite;
}
.item.next .tag { background: var(--gold); color: var(--ink); }
.item.built .emo { animation: bob 3.2s ease-in-out infinite; }
.item.fresh .emo { animation: popin .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes spin { to { rotate: 360deg; } }
@keyframes bob { 50% { translate: 0 -3px; } }
@keyframes popin { 0% { scale: 0; } 100% { scale: 1; } }

/* ---------- buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; padding: 8px 18px;
  border-radius: 18px;
  font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: 0.03em;
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.28);
  background: linear-gradient(#9aa0d8, #5d64a8);
  box-shadow: 0 5px 0 #353a72, inset 0 2px 0 rgba(255,255,255,.35);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #353a72, inset 0 2px 0 rgba(255,255,255,.35); }
.btn.big { min-height: 60px; font-size: 26px; }
.btn.green { background: linear-gradient(#8ef05f, var(--leaf) 55%, #3fa024); box-shadow: 0 5px 0 var(--leaf-deep), inset 0 2px 0 rgba(255,255,255,.45); }
.btn.green:active { box-shadow: 0 1px 0 var(--leaf-deep); }
.btn.gold { color: #5a3300; text-shadow: 0 1px 0 rgba(255,255,255,.5); background: linear-gradient(#fff08a, var(--gold) 55%, #f0a800); box-shadow: 0 5px 0 var(--gold-deep), inset 0 2px 0 rgba(255,255,255,.6); }
.btn.gold:active { box-shadow: 0 1px 0 var(--gold-deep); }
.btn.purple { background: linear-gradient(#b878f0, var(--velvet) 55%, #6e2aa6); box-shadow: 0 5px 0 var(--velvet-deep), inset 0 2px 0 rgba(255,255,255,.35); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink-soft); text-shadow: none; font-size: 18px; min-height: 42px; }
.btn.ghost.danger { color: var(--ruby); }
.btn .cost { display: inline-flex; align-items: center; gap: 3px; padding: 2px 10px 2px 4px; border-radius: 12px; background: rgba(0,0,0,.18); font-size: 18px; }
.btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { scale: 1.04; } }

.btn.build { min-height: 48px; font-size: 18px; background: linear-gradient(#8e93c7, #585e9c); }
.btn.build.ready { color: #5a3300; text-shadow: 0 1px 0 rgba(255,255,255,.5); background: linear-gradient(#fff08a, var(--gold) 55%, #f0a800); box-shadow: 0 5px 0 var(--gold-deep), inset 0 2px 0 rgba(255,255,255,.6); animation: pulse 1.6s ease-in-out infinite; }

/* ---------- widgets & play ---------- */
.widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.widget {
  position: relative; display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 8px 10px; border-radius: 16px; text-align: left; font-size: 14px;
  background: var(--glass); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
}
.widget .wcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.widget b { margin-left: auto; font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--gold); }
.widget .dot { position: absolute; top: 6px; right: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--ruby); box-shadow: 0 0 0 2px var(--night), 0 0 10px var(--ruby); animation: pulse 1.2s infinite; }

.playwrap { padding-block: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.streak { margin: 0; display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.flame {
  display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 5px;
  border-radius: 13px 13px 13px 4px; rotate: -45deg;
  background: radial-gradient(circle at 60% 70%, #ffe680, #ff8a1c 60%, #e2341c);
  font-family: var(--font-display); font-weight: 400; color: #fff; font-size: 14px;
}
.flame { rotate: 0deg; border-radius: 13px; }
.btn.play {
  height: 74px; border-radius: 26px; font-size: 32px; gap: 10px;
  background: linear-gradient(#93f565, var(--leaf) 55%, #3a9a20);
  box-shadow: 0 7px 0 var(--leaf-deep), 0 12px 30px rgba(85, 199, 54, .35), inset 0 3px 0 rgba(255,255,255,.45);
  animation: pulse 1.6s ease-in-out infinite;
}
.btn.play .lbl { font-size: 22px; opacity: .9; }
.btn.play.hard { background: linear-gradient(#ff8f8f, var(--ruby) 55%, #b81e34); box-shadow: 0 7px 0 var(--ruby-deep), 0 12px 30px rgba(236, 58, 82, .35), inset 0 3px 0 rgba(255,255,255,.4); }
.btn.play.super { background: linear-gradient(#d39bff, var(--velvet) 55%, #5e1f96); box-shadow: 0 7px 0 var(--velvet-deep), 0 12px 30px rgba(138, 60, 196, .45), inset 0 3px 0 rgba(255,255,255,.4); }
.btn.play.nudge { animation: nudge .5s; }
@keyframes nudge { 20%, 60% { translate: -6px 0; } 40%, 80% { translate: 6px 0; } }
.playtag { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #ffb3bf; }

/* ---------- game ---------- */
#board { position: absolute; top: 0; left: calc(-1 * var(--gutter-l)); width: calc(100% + var(--gutter-l) + var(--gutter-r)); height: 100%; touch-action: none; }
#game { overflow: visible; }
.hud { position: relative; z-index: 2; display: flex; align-items: stretch; gap: 8px; padding-block: 10px 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .roundbtn { margin-left: 0; align-self: center; }
.movesbox {
  flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 84px; padding: 4px 0 6px; border-radius: 18px;
  background: linear-gradient(var(--panel), #f3d79a); color: var(--ink);
  box-shadow: 0 4px 0 #a9782a, inset 0 0 0 2px #fff6dd;
}
.movesbox b { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.movesbox small { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.movesbox.low b { color: var(--ruby); animation: pulse .9s infinite; }
.goals {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-evenly; gap: 6px;
  padding: 6px 8px; border-radius: 18px; background: var(--glass); box-shadow: inset 0 0 0 2px rgba(255,207,63,.35);
}
.goal { position: relative; display: flex; flex-direction: column; align-items: center; }
.goal img { width: 38px; height: 38px; }
.goal .cnt { font-family: var(--font-display); font-weight: 400; font-size: 18px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.goal.done .cnt { color: #7dff6a; }
.goal.bump img { animation: bump .25s; }
@keyframes bump { 50% { scale: 1.25; } }

.boosters {
  position: relative; z-index: 2; margin-top: auto;
  display: flex; justify-content: center; gap: 12px; padding-block: 0 12px; pointer-events: none;
}
.bst {
  pointer-events: auto; position: relative; width: 58px; height: 58px; border-radius: 18px;
  display: grid; place-items: center;
  background: linear-gradient(#5a62c8, #333a8e); box-shadow: 0 4px 0 #1d2260, inset 0 2px 0 rgba(255,255,255,.25);
}
.bst img { width: 38px; height: 38px; }
.bst .badge, .pre .badge {
  position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px;
  display: grid; place-items: center; font-size: 13px; background: var(--ruby); color: #fff; box-shadow: 0 0 0 2px var(--night);
}
.bst .badge.buy, .pre .badge.buy { background: var(--leaf); }
.bst.on { background: linear-gradient(#ffe680, var(--gold)); box-shadow: 0 4px 0 var(--gold-deep), 0 0 18px rgba(255,207,63,.7); }
.bst.locked img { filter: grayscale(1) brightness(.6); opacity: .6; }
.bst.locked small { position: absolute; bottom: 2px; font-size: 10px; color: var(--muted); }
.bst:active { transform: translateY(3px); box-shadow: 0 1px 0 #1d2260; }

.tipcard, .boosterhint {
  position: absolute; z-index: 3; left: 0; right: 0; bottom: 84px; margin: 0 auto; max-width: 380px;
  padding: 10px 14px; border-radius: 14px; text-align: center; font-size: 14px; line-height: 1.35;
  background: var(--panel); color: var(--ink); box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 0 0 2px var(--panel-edge);
  pointer-events: none;
}
.boosterhint { background: var(--gold); }

.banner {
  position: absolute; z-index: 4; inset: 30% 0 auto; margin: 0 auto; width: fit-content; max-width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 26px;
  border-radius: 22px; text-align: center; pointer-events: none;
  background: linear-gradient(rgba(79, 24, 120, .92), rgba(40, 12, 70, .92)); box-shadow: 0 0 0 3px var(--gold), 0 18px 40px rgba(0,0,0,.45);
}
.banner.show { animation: bannerIn .45s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes bannerIn { from { scale: .3; opacity: 0; } to { scale: 1; opacity: 1; } }
.banner small { font-size: 14px; color: var(--muted); }
.banner .big, .banner > small:first-child { font-family: var(--font-display); font-weight: 400; color: var(--gold); text-shadow: 0 3px 0 var(--velvet-deep); }
.banner .big { font-size: 38px; }
.banner > small:first-child { font-size: 34px; color: var(--gold); }
.banner em { font-style: normal; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.banner .bgoals { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.banner .bgoals b { margin-right: 8px; }
.k1 { color: #ff8fa0; } .k2 { color: #d9a6ff; }

/* ---------- modal ---------- */
.modal {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  padding: env(safe-area-inset-top, 0px) var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter-l);
  background: rgba(6, 6, 30, 0.72);
}
.modal.open { animation: fade .2s both; }
.modal.open .card { animation: cardIn .38s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes fade { from { opacity: 0; } }
@keyframes cardIn { from { scale: .6; opacity: 0; } }
.card {
  position: relative; width: min(100%, 380px); max-height: calc(100% - 32px); overflow: auto;
  padding: 70px 20px 18px; border-radius: 26px;
  display: flex; flex-direction: column; align-items: stretch; gap: 10px;
  background: linear-gradient(var(--panel), #f6dfab); color: var(--ink);
  box-shadow: 0 0 0 4px var(--panel-edge), 0 0 0 7px #7a4a12, 0 24px 60px rgba(0,0,0,.5);
  text-align: center;
}
.ribbon {
  position: absolute; top: 14px; left: 50%; translate: -50% 0; width: max-content; max-width: 92%;
  padding: 8px 26px; border-radius: 14px;
  font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: .02em; color: #fff;
  background: linear-gradient(#b878f0, var(--velvet) 60%, #6e2aa6); box-shadow: 0 4px 0 var(--velvet-deep);
  text-shadow: 0 2px 0 rgba(0,0,0,.3); text-wrap: balance;
}
.ribbon.red { background: linear-gradient(#ff8f8f, var(--ruby) 60%, #b81e34); box-shadow: 0 4px 0 var(--ruby-deep); }
.ribbon.purple { background: linear-gradient(#d39bff, #7a2fb8 60%, #4f1878); box-shadow: 0 4px 0 #2c0b47; }
.ribbon.gold { color: #5a3300; text-shadow: 0 1px 0 rgba(255,255,255,.5); background: linear-gradient(#fff08a, var(--gold) 55%, #f0a800); box-shadow: 0 4px 0 var(--gold-deep); }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.sub { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink-soft); }
.sub b { color: var(--ink); }
.label { margin: 4px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.fine { margin: 0; font-size: 12px; color: var(--ink-soft); }
.tip { margin: 0; padding: 8px 12px; border-radius: 12px; background: rgba(138, 60, 196, .12); font-size: 14px; line-height: 1.35; }
.kindtag { margin-top: -2px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
.kindtag.k1 { color: var(--ruby); } .kindtag.k2 { color: var(--velvet); }
.goalrow { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.goalrow .g { display: flex; flex-direction: column; align-items: center; min-width: 72px; padding: 8px 6px; border-radius: 16px; background: rgba(58, 29, 82, .08); }
.goalrow .g b { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.goalrow .g small { font-size: 11px; color: var(--ink-soft); }
.prerow { display: flex; justify-content: center; gap: 12px; }
.pre {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  width: 82px; padding: 8px 4px 6px; border-radius: 16px; color: var(--ink);
  background: rgba(58, 29, 82, .08); box-shadow: inset 0 0 0 2px rgba(58, 29, 82, .15);
}
.pre small { display: flex; align-items: center; gap: 2px; font-size: 11px; }
.pre.on { background: rgba(85, 199, 54, .22); box-shadow: inset 0 0 0 3px var(--leaf); }
.pre.on::after { content: "✓"; position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--leaf); color: #fff; font-size: 13px; }
.streakline { margin: 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; font-size: 13px; color: var(--ink-soft); }
.next { margin: 0; font-size: 14px; color: var(--ink-soft); }
.chestwrap { display: grid; place-items: center; }
.chestimg { width: 110px; height: 110px; }
.chestimg.pop { animation: popin .6s cubic-bezier(.2,1.6,.4,1) both; }
.chestimg.dim { filter: grayscale(.6) brightness(.8); }

      <button class="btn green big tapplay" id="introPlay" hidden>Tap to play</button>
      <p class="legalnote">By playing you agree to the <button data-legal="terms">Terms of Service</button> and <button data-legal="privacy">Privacy Policy</button>.</p>
    </div>
  </div>

  <div class="legal" id="legalView" role="dialog" aria-modal="true" aria-labelledby="legalTitle" hidden>
    <header class="lhead">
      <button class="roundbtn" id="legalBack" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6a1.5 1.5 0 0 1 0 2.1L10.1 12l5.3 5.3a1.5 1.5 0 1 1-2.1 2.1l-6.4-6.3a1.5 1.5 0 0 1 0-2.2l6.4-6.3a1.5 1.5 0 0 1 2.1 0z"/></svg>
      </button>
      <h2 id="legalTitle">Privacy Policy</h2>
    </header>
    <nav class="ltabs" aria-label="Legal documents">
      <button data-legal="privacy">Privacy</button><button data-legal="terms">Terms</button><button data-legal="credits">Credits</button>
    </nav>
    <article class="lbody" id="legalBody"></article>
  </div>

  <div class="modal" id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* Castle Cascade — match-3 rules engine.
 * Pure logic, no DOM: the browser replays the events it records, and the
 * Node tuning bot (tools/tune.js) plays thousands of levels with it.
 *
 * Board: flat array of cells, index = r * cols + c, row 0 at the top.
 * Piece kinds: g (gem, has colour c), rh / rv (rocket clearing a row / column),
 * tnt, pr (propeller), lb (light ball), relic (must reach the bottom).
 */
(function (root) {
  'use strict';

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const SPECIAL = { rh: 1, rv: 1, tnt: 1, pr: 1, lb: 1 };
  const isSpecial = (p) => !!(p && SPECIAL[p.k]);
  const isRocket = (k) => k === 'rh' || k === 'rv';

  // Which combo two swapped specials make, and what the propeller / light ball carries.
  function comboOf(k1, k2) {
    if (k1 === 'lb' && k2 === 'lb') return { combo: 'bb' };
    if (k1 === 'lb' || k2 === 'lb') return { combo: 'bX', carry: k1 === 'lb' ? k2 : k1 };
    if (k1 === 'pr' && k2 === 'pr') return { combo: 'pp' };
    if (k1 === 'pr' || k2 === 'pr') return { combo: 'pX', carry: k1 === 'pr' ? k2 : k1 };
    if (k1 === 'tnt' && k2 === 'tnt') return { combo: 'tt' };
    if (k1 === 'tnt' || k2 === 'tnt') return { combo: 'rt' };
    return { combo: 'rr' };
  }

  class Game {
    constructor(level, opt) {
      opt = opt || {};
      this.level = level;
      this.rows = level.rows;
      this.cols = level.cols;
      this.colors = level.colors;
      this.moves = opt.moves != null ? opt.moves : level.moves;
      this.rng = mulberry32(opt.seed != null ? opt.seed : (Math.random() * 4294967296) >>> 0);
      this.rec = opt.record !== false;
      this.events = [];
      this.nextId = 1;
      this.status = 'play';
      this.inBonus = false;
      this.cleared = 0;
      this.top = level.top;
      this.bot = level.bot;
      this.relicMax = level.relicMax || 2;
      this.relicTotal = 0;
      this.relicSpawned = 0;
      this.relicOnBoard = 0;
      this.sinceRelic = 0;

      const N = this.rows * this.cols;
      this.cells = new Array(N);
      for (let i = 0; i < N; i++) {
        const s = level.grid[i];
        this.cells[i] = {
          v: !!s.v,
          p: null,
          b: s.b ? { t: s.b, hp: s.hp || 1 } : null,
          moss: s.moss || 0,
          lock: s.lock || 0,
        };
      }

      // Obstacle goals always count what is actually on the board.
      const count = { crate: 0, stone: 0, moss: 0, lock: 0 };
      for (const x of this.cells) {
        if (x.v) continue;
        if (x.b) count[x.b.t]++;
        if (x.moss) count.moss++;
        if (x.lock) count.lock++;
      }
      this.goals = level.goals.map((g) => {
        const total = count[g.type] != null ? count[g.type] : g.count;
        return { type: g.type, color: g.color, total, left: total };
      });
      const relicGoal = this.goals.find((g) => g.type === 'relic');
      if (relicGoal) this.relicTotal = relicGoal.total;

      this.fillInitial(opt.boosters || []);
    }

    ev(e) { if (this.rec) this.events.push(e); }
    takeEvents() { const e = this.events; this.events = []; return e; }

    // ---------- setup ----------

    colorAt(r, c) {
      if (r < 0 || c < 0 || r >= this.rows || c >= this.cols) return -1;
      const x = this.cells[r * this.cols + c];
      return (!x.v && !x.b && x.p && x.p.k === 'g') ? x.p.c : -1;
    }

    // A colour for cell i that does not complete a line of 3 or a 2x2 square.
    safeColor(i) {
      const C = this.cols, r = (i / C) | 0, c = i - r * C;
      const at = (dr, dc) => this.colorAt(r + dr, c + dc);
      const start = (this.rng() * this.colors) | 0;
      for (let k = 0; k < this.colors; k++) {
        const x = (start + k) % this.colors;
        if (at(0, -1) === x && (at(0, -2) === x || at(0, 1) === x)) continue;
        if (at(0, 1) === x && at(0, 2) === x) continue;
        if (at(-1, 0) === x && (at(-2, 0) === x || at(1, 0) === x)) continue;
        if (at(1, 0) === x && at(2, 0) === x) continue;
        let sq = false;
        for (let dr = -1; dr <= 0 && !sq; dr++) {
          for (let dc = -1; dc <= 0 && !sq; dc++) {
            let n = 0;
            for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
              const rr = dr + a, cc = dc + b;
              if (rr === 0 && cc === 0) continue;
              if (at(rr, cc) === x) n++;
            }
            if (n === 3) sq = true;
          }
        }
        if (sq) continue;
        return x;
      }
      return start;
    }

    newGem(c) { return { id: this.nextId++, k: 'g', c }; }

    fillInitial(boosters) {
      const C = this.cols, N = this.rows * C, cells = this.cells;
      // Relics start near the top of random columns.
      const relics = Math.min(this.relicTotal, this.relicMax);
      if (relics > 0) {
        const cols = [];
        for (let c = 0; c < C; c++) {
          const r = this.top[c] + 1;
          if (r < this.bot[c] - 2 && !cells[r * C + c].b && !cells[r * C + c].lock) cols.push(c);
        }
        this.shuffleArr(cols);
        for (let k = 0; k < relics && k < cols.length; k++) {
          const c = cols[k];
          cells[(this.top[c] + 1) * C + c].p = { id: this.nextId++, k: 'relic', c: -1 };
          this.relicSpawned++;
          this.relicOnBoard++;
        }
      }
      for (let i = 0; i < N; i++) {
        const x = cells[i];
        if (!x.v && !x.b && !x.p) x.p = this.newGem(this.safeColor(i));
      }
      for (const b of boosters) {
        const cand = this.gemCells(true);
        if (!cand.length) break;
        const i = cand[(this.rng() * cand.length) | 0];
        const k = b === 'rocket' ? (this.rng() < 0.5 ? 'rh' : 'rv') : b;
        cells[i].p = { id: this.nextId++, k, c: -1 };
      }
      for (let k = 0; k < 40 && !this.hasMove(); k++) this.recolor(this.gemCells(true));
    }

    shuffleArr(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = (this.rng() * (i + 1)) | 0;
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    // Indices of cells holding a plain gem; unlockedOnly skips chained cells.
    gemCells(unlockedOnly) {
      const out = [];
      for (let i = 0; i < this.cells.length; i++) {
        const x = this.cells[i];
        if (!x.v && !x.b && x.p && x.p.k === 'g' && !(unlockedOnly && x.lock)) out.push(i);
      }
      return out;
    }

    recolor(list) {
      for (const i of list) this.cells[i].p.c = -1;
      for (const i of list) this.cells[i].p.c = this.safeColor(i);
    }

    // ---------- queries ----------

    movable(i) {
      const x = this.cells[i];
      return !!(x && !x.v && !x.b && !x.lock && x.p);
    }

    adjacent(a, b) {
      const C = this.cols;
      if (a < 0 || b < 0) return false;
      const ra = (a / C) | 0, rb = (b / C) | 0;
      return (ra === rb && Math.abs(a - b) === 1) || Math.abs(a - b) === C;
    }

    matchAt(i) {
      const C = this.cols, r = (i / C) | 0, c = i - r * C;
      const x = this.colorAt(r, c);
      if (x < 0) return false;
      let n = 1;
      for (let k = c - 1; this.colorAt(r, k) === x; k--) n++;
      for (let k = c + 1; this.colorAt(r, k) === x; k++) n++;
      if (n >= 3) return true;
      n = 1;
      for (let k = r - 1; this.colorAt(k, c) === x; k--) n++;
      for (let k = r + 1; this.colorAt(k, c) === x; k++) n++;
      if (n >= 3) return true;
      for (let dr = -1; dr <= 0; dr++) {
        for (let dc = -1; dc <= 0; dc++) {
          if (this.colorAt(r + dr, c + dc) === x && this.colorAt(r + dr + 1, c + dc) === x &&
              this.colorAt(r + dr, c + dc + 1) === x && this.colorAt(r + dr + 1, c + dc + 1) === x) return true;
        }
      }
      return false;
    }

    // Every legal move: {a, b} swaps and {tap} special activations.
    findMoves(firstOnly) {
      const out = [], C = this.cols, R = this.rows, cells = this.cells;
      for (let i = 0; i < cells.length; i++) {
        if (!this.movable(i)) continue;
        const p = cells[i].p;
        if (isSpecial(p)) {
          out.push({ tap: i });
          if (firstOnly) return out;
        }
        const r = (i / C) | 0, c = i - r * C;
        const nbs = [];
        if (c < C - 1) nbs.push(i + 1);
        if (r < R - 1) nbs.push(i + C);
        for (const j of nbs) {
          if (!this.movable(j)) continue;
          const q = cells[j].p;
          if (isSpecial(p) || isSpecial(q)) {
            out.push({ a: i, b: j });
            if (firstOnly) return out;
            continue;
          }
          if (p.k === 'g' && q.k === 'g' && p.c === q.c) continue;
          cells[i].p = q; cells[j].p = p;
          const ok = this.matchAt(i) || this.matchAt(j);
          cells[i].p = p; cells[j].p = q;
          if (ok) {
            out.push({ a: i, b: j });
            if (firstOnly) return out;
          }
        }
      }
      return out;
    }

    hasMove() { return this.findMoves(true).length > 0; }

    // ---------- matching ----------

    findMatches() {
      const R = this.rows, C = this.cols, N = R * C, cells = this.cells;
      const col = new Int8Array(N);
      for (let i = 0; i < N; i++) {
        const x = cells[i];
        col[i] = (!x.v && !x.b && x.p && x.p.k === 'g') ? x.p.c : -1;
      }
      const h = new Uint8Array(N), v = new Uint8Array(N), sq = new Uint8Array(N);
      let any = false;
      for (let r = 0; r < R; r++) {
        let c = 0;
        while (c < C) {
          const x = col[r * C + c];
          if (x < 0) { c++; continue; }
          let e = c + 1;
          while (e < C && col[r * C + e] === x) e++;
          if (e - c >= 3) { any = true; for (let k = c; k < e; k++) h[r * C + k] = e - c; }
          c = e;
        }
      }
      for (let c = 0; c < C; c++) {
        let r = 0;
        while (r < R) {
          const x = col[r * C + c];
          if (x < 0) { r++; continue; }
          let e = r + 1;
          while (e < R && col[e * C + c] === x) e++;
          if (e - r >= 3) { any = true; for (let k = r; k < e; k++) v[k * C + c] = e - r; }
          r = e;
        }
      }
      for (let r = 0; r < R - 1; r++) {
        for (let c = 0; c < C - 1; c++) {
          const i = r * C + c, x = col[i];
          if (x >= 0 && col[i + 1] === x && col[i + C] === x && col[i + C + 1] === x) {
            any = true;
            sq[i] = sq[i + 1] = sq[i + C] = sq[i + C + 1] = 1;
          }
        }
      }
      if (!any) return [];

      const seen = new Uint8Array(N), groups = [];
      for (let s = 0; s < N; s++) {
        if (seen[s] || !(h[s] || v[s] || sq[s])) continue;
        const x = col[s], members = [], cross = [], stack = [s];
        let maxH = 0, maxV = 0, hasSq = false;
        seen[s] = 1;
        while (stack.length) {
          const i = stack.pop();
          members.push(i);
          if (h[i] > maxH) maxH = h[i];
          if (v[i] > maxV) maxV = v[i];
          if (sq[i]) hasSq = true;
          if (h[i] && v[i]) cross.push(i);
          const r = (i / C) | 0, c = i - r * C;
          const push = (j) => {
            if (!seen[j] && col[j] === x && (h[j] || v[j] || sq[j])) { seen[j] = 1; stack.push(j); }
          };
          if (c > 0) push(i - 1);
          if (c < C - 1) push(i + 1);
          if (r > 0) push(i - C);
          if (r < R - 1) push(i + C);
        }
        let sp = null;
        if (maxH >= 5 || maxV >= 5) sp = 'lb';
        else if (maxH >= 3 && maxV >= 3) sp = 'tnt';
        else if (maxH === 4) sp = 'rv';
        else if (maxV === 4) sp = 'rh';
        else if (hasSq) sp = 'pr';
        groups.push({ cells: members, color: x, sp, cross });
      }
      return groups;
    }

    // Where a match group's new special appears: the moved piece if possible.
    pickSpot(g, prefer) {
      const cand = (g.sp === 'tnt' && g.cross.length) ? g.cross : g.cells;
      const free = (i) => !this.cells[i].lock;
      if (prefer) for (const i of prefer) if (cand.includes(i) && free(i)) return i;
      const ok = cand.filter(free).sort((a, b) => a - b);
      if (ok.length) return ok[ok.length >> 1];
      const any = g.cells.filter(free);
      return any.length ? any[any.length >> 1] : -1;
    }

    goalDec(type, color) {
      for (let k = 0; k < this.goals.length; k++) {
        const g = this.goals[k];
        if (g.type === type && (type !== 'color' || g.color === color) && g.left > 0) {
          g.left--;
          return k;
        }
      }
      return -1;
    }

    neighbors(i) {
      const C = this.cols, R = this.rows, r = (i / C) | 0, c = i - r * C, out = [];
      if (c > 0) out.push(i - 1);
      if (c < C - 1) out.push(i + 1);
      if (r > 0) out.push(i - C);
      if (r < R - 1) out.push(i + C);
      return out;
    }

    hitBlocker(i, hits, d) {
      const cell = this.cells[i], b = cell.b;
      b.hp--;
      const hit = { i, k: b.t, hp: b.hp, d };
      if (b.hp <= 0) {
        cell.b = null;
        hit.gi = this.goalDec(b.t);
      }
      hits.push(hit);
    }

    hitMoss(i, hits, d) {
      const cell = this.cells[i];
      cell.moss--;
      const hit = { i, k: 'moss', hp: cell.moss, d };
      if (cell.moss <= 0) { cell.moss = 0; hit.gi = this.goalDec('moss'); }
      hits.push(hit);
    }

    clearGroups(groups, prefer, combo) {
      const hits = [], created = [];
      for (const g of groups) {
        const spot = g.sp ? this.pickSpot(g, prefer) : -1;
        const adj = new Set();
        for (const i of g.cells) {
          const cell = this.cells[i];
          if (cell.lock) {
            cell.lock = 0;
            hits.push({ i, k: 'lock', d: 0, gi: this.goalDec('lock') });
            continue;
          }
          const p = cell.p;
          cell.p = null;
          const hit = { i, k: 'gem', id: p.id, c: p.c, d: 0, gi: this.goalDec('color', p.c) };
          if (spot >= 0) hit.into = spot;
          hits.push(hit);
          if (cell.moss) this.hitMoss(i, hits, 0);
          for (const nb of this.neighbors(i)) {
            const b = this.cells[nb].b;
            if (b && b.t === 'crate') adj.add(nb);
          }
        }
        for (const nb of adj) if (this.cells[nb].b) this.hitBlocker(nb, hits, 60);
        if (spot >= 0 && !this.cells[spot].p && !this.cells[spot].b) {
          const np = { id: this.nextId++, k: g.sp, c: -1 };
          this.cells[spot].p = np;
          created.push({ i: spot, id: np.id, k: np.k });
        }
      }
      this.cleared += hits.length;
      this.ev({ t: 'match', hits, created, combo });
    }

    // ---------- blasts ----------

    // One blast reaching cell i. Specials caught in it go to the next wave.
    hitCell(i, hits, next, d, seen) {
      if (i < 0 || i >= this.cells.length || seen[i]) return;
      seen[i] = 1;
      const cell = this.cells[i];
      if (cell.v) return;
      if (cell.b) { this.hitBlocker(i, hits, d); return; }
      if (cell.lock) {
        cell.lock = 0;
        hits.push({ i, k: 'lock', d, gi: this.goalDec('lock') });
        return;
      }
      const p = cell.p;
      if (p) {
        if (SPECIAL[p.k]) {
          cell.p = null;
          next.push({ i, p });
        } else if (p.k === 'g') {
          cell.p = null;
          hits.push({ i, k: 'gem', id: p.id, c: p.c, d, gi: this.goalDec('color', p.c) });
        }
      }
      if (cell.moss) this.hitMoss(i, hits, d);
    }

    mostCommonColor() {
      const n = new Array(this.colors).fill(0);
      for (const x of this.cells) if (!x.v && !x.b && x.p && x.p.k === 'g') n[x.p.c]++;
      let best = 0, bc = 0;
      for (let c = 0; c < n.length; c++) {
        if (n[c] > best || (n[c] === best && this.rng() < 0.5)) { best = n[c]; bc = c; }
      }
      return bc;
    }

    // Best cell for a propeller: whatever still counts toward a goal.
    pickTarget(seen) {
      const C = this.cols, cells = this.cells;
      const need = {};
      const colors = {};
      for (const g of this.goals) {
        if (g.left <= 0) continue;
        if (g.type === 'color') colors[g.color] = 1;
        else need[g.type] = 1;
      }
      let best = -1, bestS = 0, ties = 0;
      for (let i = 0; i < cells.length; i++) {
        if (seen[i]) continue;
        const x = cells[i];
        if (x.v) continue;
        let s = 0;
        if (x.b) s = need[x.b.t] ? (x.b.t === 'stone' ? 12 : 10) : 2;
        else if (x.lock) s = need.lock ? 8 : 1;
        else if (x.moss && need.moss) s = 7;
        else if (x.p) {
          if (x.p.k === 'g') s = colors[x.p.c] ? 4 : 1;
          else if (x.p.k !== 'relic') s = 1;
        }
        if (need.relic && !x.b && i >= C && cells[i - C].p && cells[i - C].p.k === 'relic') s = Math.max(s, 6);
        if (s <= 0) continue;
        if (s > bestS) { bestS = s; best = i; ties = 1; } else if (s === bestS) {
          ties++;
          if (this.rng() * ties < 1) best = i;
        }
      }
      return best;
    }

    // Area effects shared by specials, combos and carried boosters.
    blastShape(kind, i, base, hits, next, seen, fx) {
      const C = this.cols, R = this.rows, r = (i / C) | 0, c = i - r * C;
      const row = (rr, d0) => { if (rr < 0 || rr >= R) return; for (let cc = 0; cc < C; cc++) this.hitCell(rr * C + cc, hits, next, base + d0 + Math.abs(cc - c) * 32, seen); };
      const column = (cc, d0) => { if (cc < 0 || cc >= C) return; for (let rr = 0; rr < R; rr++) this.hitCell(rr * C + cc, hits, next, base + d0 + Math.abs(rr - r) * 32, seen); };
      const square = (rad) => {
        for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr < 0 || cc < 0 || rr >= R || cc >= C) continue;
          this.hitCell(rr * C + cc, hits, next, base + Math.max(Math.abs(dr), Math.abs(dc)) * 45, seen);
        }
      };
      if (kind === 'rh') { fx.push({ t: 'rocket', i, dir: 'h', d: base }); row(r, 0); }
      else if (kind === 'rv') { fx.push({ t: 'rocket', i, dir: 'v', d: base }); column(c, 0); }
      else if (kind === 'rr') {
        fx.push({ t: 'rocket', i, dir: 'h', d: base }, { t: 'rocket', i, dir: 'v', d: base });
        row(r, 0); column(c, 0);
      } else if (kind === 'rt') {
        for (let k = -1; k <= 1; k++) {
          fx.push({ t: 'rocket', i: Math.max(0, Math.min(R - 1, r + k)) * C + c, dir: 'h', d: base, big: 1 });
          fx.push({ t: 'rocket', i: r * C + Math.max(0, Math.min(C - 1, c + k)), dir: 'v', d: base, big: 1 });
          row(r + k, 0); column(c + k, 0);
        }
      } else if (kind === 'tnt') { fx.push({ t: 'tnt', i, rad: 2, d: base }); square(2); }
      else if (kind === 'tt') { fx.push({ t: 'tnt', i, rad: 3, d: base }); square(3); }
    }

    activate(item, hits, fx, next, transforms, removed) {
      const C = this.cols, i = item.i, p = item.p;
      removed.push(p.id);
      if (item.other) removed.push(item.other.id);
      const seen = new Uint8Array(this.cells.length);
      const combo = item.combo;
      const kind = combo || p.k;

      if (kind === 'rh' || kind === 'rv' || kind === 'tnt' || kind === 'rr' || kind === 'rt' || kind === 'tt') {

        return;
      }
      if (kind === 'pr' || kind === 'pp' || kind === 'pX') {
        this.hitCell(i, hits, next, 0, seen);
        for (const nb of this.neighbors(i)) this.hitCell(nb, hits, next, 40, seen);
        const flights = kind === 'pp' ? 3 : 1;
        for (let f = 0; f < flights; f++) {
          const to = this.pickTarget(seen);
          if (to < 0) break;
          fx.push({ t: 'prop', i, to, d: 0, carry: item.carry || null });
          const land = 380 + f * 90;
          if (kind === 'pX') {
            const carry = item.carry === 'tnt' ? 'tnt' : item.carry;
            this.blastShape(carry, to, land, hits, next, seen, fx);
          } else {
            this.hitCell(to, hits, next, land, seen);
          }
        }
        return;
      }
      if (kind === 'lb') {
        const color = item.color != null ? item.color : this.mostCommonColor();
        const targets = [];
        for (let j = 0; j < this.cells.length; j++) {
          const x = this.cells[j];
          if (!x.v && !x.b && x.p && x.p.k === 'g' && x.p.c === color) targets.push(j);
        }
        fx.push({ t: 'ball', i, targets, d: 0 });
        this.hitCell(i, hits, next, 0, seen);
        targets.forEach((j, k) => this.hitCell(j, hits, next, 140 + Math.min(k, 30) * 22, seen));
        return;
      }
      if (kind === 'bX') {
        const color = this.mostCommonColor();
        const targets = [];
        for (let j = 0; j < this.cells.length; j++) {
          const x = this.cells[j];
          if (!x.v && !x.b && !x.lock && x.p && x.p.k === 'g' && x.p.c === color) targets.push(j);
        }
        fx.push({ t: 'ball', i, targets, d: 0 });
        targets.forEach((j, k) => {
          const x = this.cells[j], q = x.p;
          q.k = isRocket(item.carry) ? (this.rng() < 0.5 ? 'rh' : 'rv') : item.carry;
          q.c = -1;
          transforms.push({ i: j, id: q.id, k: q.k, d: 140 + Math.min(k, 30) * 22 });
          x.p = null;
          next.push({ i: j, p: q });
        });

      }
      if (kind === 'bb') {
        const R = this.rows, r = (i / C) | 0, c = i - r * C;
        fx.push({ t: 'nova', i, d: 0 });
        for (let j = 0; j < this.cells.length; j++) {
          const rr = (j / C) | 0, cc = j - rr * C;
          this.hitCell(j, hits, next, 100 + Math.max(Math.abs(rr - r), Math.abs(cc - c)) * 55, seen);

    }

    runWaves(queue) {
      let guard = 0;
      while (queue.length && guard++ < 80) {
        const hits = [], fx = [], next = [], transforms = [], removed = [];
        for (const item of queue) this.activate(item, hits, fx, next, transforms, removed);
        this.cleared += hits.length;
        this.ev({ t: 'blast', hits, fx, removed, transforms });

    // ---------- gravity ----------

    // Can an empty cell be filled by something falling straight down?

      const C = this.cols;
      for (let k = r - 1; k >= this.top[c]; k--) {
        const x = this.cells[k * C + c];
        if (x.b || x.lock) return false;
        if (x.p) return true;
      }

    }

    spawnPiece() {

        this.sinceRelic++;
        if ((this.relicOnBoard === 0 && this.sinceRelic > 5) || this.rng() < 0.05) {
          this.relicSpawned++;
          this.relicOnBoard++;

    // Pieces fall one cell per tick; when nothing can fall straight, they slide
    // diagonally around blockers. Paths are [row, col, tick] waypoints.

      const note = (p, fr, fc, tr, tc, spawned) => {

        if (!rec) return;

        if (!e) {

          if (spawned) e.p = { id: p.id, k: p.k, c: p.c };
          paths.set(p.id, e);
        } else {
          const last = e.path[e.path.length - 1];
          if (last[2] < t - 1) e.path.push([last[0], last[1], t - 1]);
        }

            if (r === top[c]) {

              cell.p = np;
              note(np, r - 1, c, r, c, true);
              changed = true;
              continue;
            }
            const up = cells[i - C];
            if (up.p && !up.b && !up.lock) {
              cell.p = up.p;
              up.p = null;
              note(cell.p, r - 1, c, r, c, false);
              changed = true;
            }
          }
        }
        if (!changed) {
          const order = (t & 1) ? [-1, 1] : [1, -1];
          for (let r = R - 1; r >= 1; r--) {
            for (let c = 0; c < C; c++) {
              const i = r * C + c, cell = cells[i];
              if (cell.v || cell.b || cell.p) continue;
              if (this.reachable(r, c)) continue;
              for (const dc of order) {
                const sc = c + dc;
                if (sc < 0 || sc >= C) continue;
                const s = cells[(r - 1) * C + sc];
                if (s.v || s.b || s.lock || !s.p) continue;
                const below = cells[r * C + sc];
                if (!below.v && !below.b && !below.p) continue;
                cell.p = s.p;
                s.p = null;
                note(cell.p, r - 1, sc, r, c, false);
                changed = true;
                break;
              }
            }
          }
        }
        if (!changed || t > 400) break;
      }
      if (rec && paths.size) this.ev({ t: 'fall', moves: Array.from(paths.values()), T: t - 1 });
      return Array.from(landed.values());
    }

    collectRelics() {
      let any = false;
      const C = this.cols;
      for (let c = 0; c < C; c++) {
        const i = this.bot[c] * C + c, cell = this.cells[i];
        if (cell.p && cell.p.k === 'relic' && !cell.lock) {
          const id = cell.p.id;
          cell.p = null;
          this.relicOnBoard--;
          this.ev({ t: 'collect', i, id, gi: this.goalDec('relic') });
          any = true;
        }
      }
      return any;
    }

    // ---------- turn flow ----------

    resolve(combo) {
      for (let guard = 0; guard < 300; guard++) {
        const landed = this.gravity();
        if (this.collectRelics()) continue;
        const groups = this.findMatches();
        if (!groups.length) break;
        combo++;
        this.clearGroups(groups, landed, combo);
      }
      this.settle();
    }

    goalsDone() { return this.goals.every((g) => g.left <= 0); }

    settle() {
      if (this.inBonus) return;
      if (this.goalsDone()) { this.status = 'won'; return; }
      if (this.moves <= 0) { this.status = 'lost'; return; }
      if (!this.hasMove()) this.shuffle();
    }

    swap(a, b) {
      if (this.status !== 'play' || !this.adjacent(a, b) || !this.movable(a) || !this.movable(b)) return false;
      const ca = this.cells[a], cb = this.cells[b], pa = ca.p, pb = cb.p;

          this.ev({ t: 'swap', a, b, back: true });
          return false;
        }
        this.ev({ t: 'swap', a, b });
        this.moves--;
        this.clearGroups(groups, [b, a], 1);
        this.resolve(1);
        return true;
      }
      this.ev({ t: 'swap', a, b });
      this.moves--;
      if (sa && sb) {
        ca.p = null; cb.p = null;
        const cmb = comboOf(pa.k, pb.k);
        this.runWaves([{ i: b, p: pa, other: pb, combo: cmb.combo, carry: cmb.carry }]);
      } else {
        const sp = sa ? pa : pb, at = sa ? b : a, other = sa ? pb : pa;
        this.cells[at].p = null;
        const item = { i: at, p: sp };
        if (sp.k === 'lb' && other.k === 'g') item.color = other.c;
        this.runWaves([item]);
      }
      this.resolve(0);
      return true;
    }

    tap(i) {
      if (this.status !== 'play' || !this.movable(i) || !isSpecial(this.cells[i].p)) return false;
      const p = this.cells[i].p;
      this.cells[i].p = null;
      this.moves--;
      this.ev({ t: 'tap', i, id: p.id });
      this.runWaves([{ i, p }]);
      this.resolve(0);
      return true;
    }

    // In-game boosters do not cost a move.
    useBooster(kind, i) {
      if (this.status !== 'play') return false;
      if (kind === 'shuffle') return this.shuffle(true);
      const C = this.cols, R = this.rows, r = (i / C) | 0, c = i - r * C;
      if (i < 0 || i >= this.cells.length || this.cells[i].v) return false;
      const hits = [], next = [], fx = [], seen = new Uint8Array(this.cells.length);
      if (kind === 'hammer') {
        fx.push({ t: 'hammer', i, d: 0 });
        this.hitCell(i, hits, next, 220, seen);
      } else if (kind === 'arrow') {
        fx.push({ t: 'arrow', i, d: 0 });
        for (let cc = 0; cc < C; cc++) this.hitCell(r * C + cc, hits, next, 120 + cc * 34, seen);
      } else if (kind === 'cannon') {
        fx.push({ t: 'cannon', i, d: 0 });
        for (let rr = 0; rr < R; rr++) this.hitCell(rr * C + c, hits, next, 120 + rr * 34, seen);
      } else return false;
      this.cleared += hits.length;
      this.ev({ t: 'blast', hits, fx, removed: [], transforms: [] });
      this.runWaves(next);
      this.resolve(0);
      return true;
    }

    shuffle(forced) {
      const idx = this.gemCells(true);
      if (idx.length < 3) return false;
      const orig = idx.map((i) => this.cells[i].p);
      const origColors = orig.map((p) => p.c);
      const emit = () => {
        const items = idx.map((i) => ({ i, id: this.cells[i].p.id, c: this.cells[i].p.c }));
        this.ev({ t: 'shuffle', items, forced: !!forced });
        return true;
      };
      for (let attempt = 0; attempt < 60; attempt++) {
        const perm = this.shuffleArr(orig.slice());
        idx.forEach((i, k) => { this.cells[i].p = perm[k]; });
        if (!this.findMatches().length && this.hasMove()) return emit();
      }
      idx.forEach((i, k) => { this.cells[i].p = orig[k]; });
      for (let attempt = 0; attempt < 40; attempt++) {
        this.recolor(idx);
        if (!this.findMatches().length && this.hasMove()) return emit();
      }
      idx.forEach((i, k) => { orig[k].c = origColors[k]; });
      return false;
    }

    addMoves(n) {
      this.moves += n;
      if (this.status === 'lost') this.status = 'play';
      if (!this.hasMove()) this.shuffle();
    }

    // Level-end bonus: each unused move becomes a rocket that fires.
    bonus() {
      this.inBonus = true;
      let m = this.moves;
      const total = m;
      this.moves = 0;
      for (let guard = 0; m > 0 && guard < 60; guard++) {
        const gems = this.shuffleArr(this.gemCells(true));
        if (!gems.length) break;
        const picks = gems.slice(0, Math.min(m, 4));
        m -= picks.length;
        const transforms = [], queue = [];
        for (const i of picks) {
          const p = this.cells[i].p;
          p.k = this.rng() < 0.5 ? 'rh' : 'rv';
          p.c = -1;
          transforms.push({ i, id: p.id, k: p.k, d: 0 });
          this.cells[i].p = null;
          queue.push({ i, p });
        }
        this.ev({ t: 'bonus', transforms, left: m });
        this.runWaves(queue);
        this.resolve(0);
      }
      for (let k = 0; k < 6; k++) {
        const queue = [];
        for (let i = 0; i < this.cells.length; i++) {
          const x = this.cells[i];
          if (isSpecial(x.p) && !x.lock) { queue.push({ i, p: x.p }); x.p = null; }
        }
        if (!queue.length) break;
        this.ev({ t: 'bonus', transforms: [], left: 0 });
        this.runWaves(queue);
        this.resolve(0);
      }
      this.inBonus = false;
      return total;
    }

    snapshot() {
      return this.cells.map((x) => ({
        v: x.v,
        p: x.p ? { id: x.p.id, k: x.p.k, c: x.p.c } : null,
        b: x.b ? { t: x.b.t, hp: x.b.hp } : null,
        moss: x.moss,
        lock: x.lock,
      }));
    }

    clone(seed) {
      const g = Object.create(Game.prototype);
      Object.assign(g, this);
      g.cells = this.cells.map((x) => ({
        v: x.v,
        p: x.p ? { id: x.p.id, k: x.p.k, c: x.p.c } : null,
        b: x.b ? { t: x.b.t, hp: x.b.hp } : null,
        moss: x.moss,
        lock: x.lock,
      }));
      g.goals = this.goals.map((x) => ({ type: x.type, color: x.color, total: x.total, left: x.left }));
      g.rng = mulberry32(seed);
      g.rec = false;
      g.events = [];
      return g;
    }
  }

  const api = { Game, mulberry32, isSpecial, comboOf };
  root.CCEngine = api;

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Castle Cascade — level generator.
 * Every level is rebuilt from its number with a seeded RNG, so 1500 levels
 * cost nothing to ship. Move counts come from js/level-table.js, which
 * tools/tune.js writes after a bot has played every level.
 */
(function (root) {
  'use strict';
  const E = root.CCEngine || require('./engine.js');
  const mulberry32 = E.mulberry32;

  const LEVEL_COUNT = 1500;
  const COLOR_NAMES = ['ruby', 'sapphire', 'emerald', 'topaz', 'amethyst', 'amber'];

  function seedFor(n, salt) {
    let h = Math.imul(n ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul((salt | 0) + 1, 0xC2B2AE35);
    h ^= h >>> 13;
    h = Math.imul(h, 0x27D4EB2F);
    h ^= h >>> 16;
    return h >>> 0;
  }

  // 0 normal, 1 hard, 2 super hard. Every tenth level is a spike, every
  // fiftieth a bigger one, and the level after a spike is a breather.
  function levelKind(n) {
    if (n < 10) return 0;
    if (n % 50 === 0) return 2;
    if (n % 10 === 0) return 1;
    if (n > 100 && n % 30 === 16) return 1;
    return 0;
  }

  const TIPS = {
    1: 'Swipe a piece into its neighbour to line up 3 of a kind.',
    2: 'Line up 4 to make a Comet. Tap it or swipe it to send it streaking across the board.',
    3: 'Match a 2×2 square to hatch a Dragonfly. It flies straight to your goals.',
    4: 'Match in an L or T shape to make a Powder Keg.',
    5: 'Line up 5 for a Prism. Swipe it into a piece to clear every piece of that colour.',
    6: 'Crates crack when you match right next to them.',
    8: 'Moss clears when a piece on top of it is matched or blasted.',
    9: 'Swipe two boosters into each other for a giant combo.',
    21: 'Chained pieces cannot move. Match them or blast them to break the chain.',
    31: 'Bring the golden crowns down to the bottom row.',
    46: 'Stone only breaks to boosters: comets, powder kegs, dragonflies and prisms.',
  };

  // Hand-tuned opening levels; everything else is generated.
  const TUTORIAL = {
    1: { cols: 7, rows: 7, style: 'rect', colors: 4, goals: [['color', 0, 20]] },
    2: { cols: 7, rows: 8, style: 'rect', colors: 4, goals: [['color', 1, 25], ['color', 2, 25]] },
    3: { cols: 8, rows: 8, style: 'corners', colors: 5, goals: [['color', 3, 25], ['color', 0, 25]] },
    4: { cols: 8, rows: 9, style: 'rect', colors: 5, goals: [['color', 4, 30], ['color', 1, 30]] },
    5: { cols: 8, rows: 9, style: 'pyramid', colors: 5, goals: [['color', 2, 45]] },
    6: { cols: 8, rows: 9, style: 'rect', colors: 5, mech: [['crate', 'bottom', 1]] },
    7: { cols: 8, rows: 9, style: 'corners', colors: 5, mech: [['crate', 'clusters', 1]], color: 1 },
    8: { cols: 8, rows: 9, style: 'rect', colors: 5, mech: [['moss', 'bottomHalf', 1]] },
    9: { cols: 9, rows: 9, style: 'arch', colors: 5, mech: [['crate', 'band', 1]], color: 1 },
  };

  const SHAPES = ['rect', 'rect', 'corners', 'pyramid', 'bowl', 'diamond', 'arch', 'crown', 'wings', 'towers'];

  function shape(cols, rows, style) {
    const top = [], bot = [], mid = (cols - 1) / 2;
    for (let c = 0; c < cols; c++) {
      const d = Math.abs(c - mid), edge = mid - d;
      let t = 0, b = rows - 1;
      switch (style) {
        case 'corners': if (edge < 1) { t = 2; b = rows - 3; } else if (edge < 2) { t = 1; b = rows - 2; } break;
        case 'pyramid': t = Math.round(d * 0.7); break;
        case 'bowl': b = rows - 1 - Math.round(d * 0.7); break;
        case 'diamond': t = Math.round(d * 0.55); b = rows - 1 - Math.round(d * 0.55); break;
        case 'arch': if (d <= 1) b = rows - 3; break;
        case 'crown': t = edge < 1 ? 0 : (Math.round(d) % 2 ? 2 : 0); break;
        case 'wings': if (d <= 1) t = 2; if (edge < 1) b = rows - 2; break;
        case 'towers': if (edge < 1 || d < 0.6) t = 0; else t = 1; if (edge >= 1 && d >= 0.6 && d <= 1.6) b = rows - 2; break;
        default: break;

      if (b - t < 4) t = Math.max(0, b - 4);

      bot.push(b);

    return { top, bot };
  }

  function gen(n, salt) {
    const rng = mulberry32(seedFor(n, salt));
    const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));

    const kind = levelKind(n);

    const prog = 1 - Math.exp(-n / 260);

    if (kind === 1) d += 0.15;

    else { cols = rng() < 0.75 ? 9 : 8; rows = rng() < 0.6 ? 10 : 9; style = pick(SHAPES); }

    const grid = [];

    }
    const mid = (cols - 1) / 2;
    const at = (r, c) => (r >= 0 && c >= 0 && r < rows && c < cols) ? grid[r * cols + c] : null;
    const playable = (r, c) => { const x = at(r, c); return x && !x.v; };
    // Everything is mirrored left/right so boards look designed.
    const sym = (r, c, fn) => { fn(r, c); const m = cols - 1 - c; if (m !== c) fn(r, m); };

    let colors = 5;
    if (tut) colors = tut.colors;
    else if (n > 100 && kind >= 1 && rng() < 0.3) colors = 6;

    // Pick this level's obstacle mechanics.
    let mech = [];
    let colorGoals = 0;
    if (tut) {
      mech = (tut.mech || []).map((m) => ({ type: m[0], pattern: m[1], hpMax: m[2] }));
      colorGoals = tut.color || 0;
    } else {
      const avail = [['crate', 3], ['moss', 3]];
      if (n >= 21) avail.push(['lock', 2]);
      if (n >= 31) avail.push(['relic', 1.4]);
      if (n >= 46) avail.push(['stone', 1.1]);
      const forced = n === 21 ? 'lock' : n === 31 ? 'relic' : n === 46 ? 'stone' : null;
      let count = 1;
      if (n >= 25 && rng() < 0.4 + d * 0.35) count = 2;
      if (kind >= 1 && n >= 60 && rng() < 0.35) count = 3;
      const pure = !forced && n >= 12 && rng() < 0.13;
      if (pure) count = 0;
      const chosen = forced ? [forced] : [];
      while (chosen.length < count) {

    const hasRelic = mech.some((m) => m.type === 'relic');
    // Rows a blocker may not use: the spawn row, and the exits on crown levels.
    const blockOK = (r, c) => playable(r, c) && r > top[c] && !(hasRelic && r >= bot[c] - 1);

    for (const m of mech) {
      if (m.type === 'crate') {
        const hpMax = m.hpMax || (n < 10 ? 1 : n < 20 ? 2 : 3);
        const pattern = m.pattern || pick(['bottom', 'bottom', 'clusters', 'band', 'frame', 'scatter', 'pillars', 'checker']);
        const hpOf = () => Math.min(hpMax, 1 + Math.floor(rng() * hpMax * (0.6 + d * 0.7)));
        const put = (r, c, hp) => {
          if (!blockOK(r, c)) return;
          const x = at(r, c);
          if (x.b) return;
          x.b = 'crate';
          x.moss = 0;
          x.hp = Math.max(1, Math.min(hpMax, hp || hpOf()));
        };
        if (pattern === 'bottom') {
          const k = 2 + Math.round(d * 2);
          const hp = hpOf();
          for (let c = 0; c <= mid; c++) for (let j = 0; j < k; j++) sym(bot[c] - j, c, (r, cc) => put(r, cc, j === 0 ? Math.min(hpMax, hp + 1) : hp));
        } else if (pattern === 'band') {
          const r0 = Math.round(rows * (0.45 + rng() * 0.2));
          const h = rng() < 0.45 + d * 0.4 ? 2 : 1;
          const hp = hpOf();
          for (let c = 0; c <= mid; c++) {
            if (Math.round(Math.abs(c - mid)) % 3 === 0) continue;
            for (let j = 0; j < h; j++) sym(r0 + j, c, (r, cc) => put(r, cc, hp));
          }
        } else if (pattern === 'clusters') {
          const k = 2 + Math.round(d * 3);
          for (let q = 0; q < k; q++) {
            const c = ri(0, Math.max(0, Math.floor(mid) - 1));
            const r = ri(2, rows - 3);
            const hp = hpOf();
            for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) sym(r + a, c + b, (rr, cc) => put(rr, cc, hp));
          }
        } else if (pattern === 'frame') {
          const hp = hpOf();
          for (let r = 0; r < rows; r++) sym(r, 0, (rr, cc) => put(rr, cc, hp));
          if (d > 0.5) for (let c = 0; c <= mid; c++) sym(bot[c], c, (rr, cc) => put(rr, cc, hp));
        } else if (pattern === 'pillars') {
          const c = Math.max(0, Math.round(mid) - 2);
          const from = ri(3, Math.max(3, rows - 4));
          const hp = hpOf();
          for (let r = from; r < rows; r++) sym(r, c, (rr, cc) => put(rr, cc, hp));
        } else if (pattern === 'checker') {
          const r0 = Math.floor(rows / 2) - 1;
          for (let r = r0; r < rows; r++) for (let c = 0; c <= mid; c++) if ((r + c) % 2 === 0) sym(r, c, (rr, cc) => put(rr, cc));
        } else {
          const k = Math.round(10 + d * 14);
          for (let q = 0; q < k; q++) sym(ri(2, rows - 1), ri(0, Math.floor(mid)), (r, c) => put(r, c));
        }
      } else if (m.type === 'moss') {
        const hpMax = m.hpMax || (n < 40 ? 1 : 2);
        const pattern = m.pattern || pick(n < 30 ? ['bottomHalf', 'center', 'stripes', 'scatter'] : ['bottomHalf', 'center', 'stripes', 'ring', 'scatter', 'checker', 'full']);
        const hpOf = () => (hpMax > 1 && rng() < 0.3 + d * 0.4) ? 2 : 1;
        const put = (r, c, hp) => {
          const x = at(r, c);
          if (!x || x.v || x.b) return;
          x.moss = hp || hpOf();
        };
        if (pattern === 'bottomHalf') {
          const from = Math.round(rows * (0.45 - d * 0.25));
          for (let r = from; r < rows; r++) for (let c = 0; c < cols; c++) put(r, c, 1);
        } else if (pattern === 'center') {
          const rad = 1.5 + d * 2.5, cr = (rows - 1) / 2;
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (Math.abs(r - cr) + Math.abs(c - mid) <= rad + 0.5) put(r, c);
        } else if (pattern === 'stripes') {
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (Math.round(Math.abs(c - mid)) % 2 === 0 && r > rows / 3) put(r, c);
        } else if (pattern === 'ring') {
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            const x = at(r, c);
            if (!x || x.v) continue;
            if (r === top[c] + 1 || r === bot[c] || c === 0 || c === cols - 1) put(r, c);
          }
        } else if (pattern === 'checker') {
          for (let r = 2; r < rows; r++) for (let c = 0; c < cols; c++) if ((r + c) % 2 === 0) put(r, c);
        } else if (pattern === 'full') {
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) put(r, c, 1);
        } else {
          const k = Math.round(14 + d * 16);
          for (let q = 0; q < k; q++) sym(ri(1, rows - 1), ri(0, Math.floor(mid)), (r, c) => put(r, c));
        }
      } else if (m.type === 'lock') {
        const k = Math.round(8 + d * 12);
        for (let q = 0; q < k * 3 && q < 60; q++) {
          const r = ri(2, rows - 1), c = ri(0, Math.floor(mid));
          sym(r, c, (rr, cc) => {
            const x = at(rr, cc);
            if (!blockOK(rr, cc) || x.b || rr <= top[cc] + 1) return;
            x.lock = 1;
          });
          let total = 0;
          for (const x of grid) total += x.lock;
          if (total >= k) break;
        }
      } else if (m.type === 'stone') {
        const k = ri(3, 4 + Math.round(d * 2));
        for (let q = 0; q < k; q++) {
          sym(ri(3, rows - 2), ri(0, Math.floor(mid)), (r, c) => {
            const x = at(r, c);
            if (!blockOK(r, c) || x.b || x.lock) return;
            x.b = 'stone';
            x.hp = 1;
            x.moss = 0;

        }

    }

    // Keep at least ~60% of the board open for pieces.
    let open = 0, play = 0;
    const crates = [];
    for (let i = 0; i < N; i++) {
      if (grid[i].v) continue;
      play++;
      if (!grid[i].b) open++;
      else if (grid[i].b === 'crate') crates.push(i);
    }
    while (open < play * 0.6 && crates.length) {
      const i = crates.splice(Math.floor(rng() * crates.length), 1)[0];
      grid[i].b = null;
      grid[i].hp = 0;
      open++;
    }

    // Goals.
    const goals = [];
    const have = (t) => grid.some((x) => !x.v && (t === 'moss' ? x.moss : t === 'lock' ? x.lock : x.b === t));
    for (const m of mech) {
      if (m.type === 'relic') {
        goals.push({ type: 'relic', count: Math.min(8, 3 + Math.round(d * 3 + rng() * 2)) });
      } else if (have(m.type)) {
        goals.push({ type: m.type, count: 0 });
      }
    }
    if (tut && tut.goals) {
      for (const g of tut.goals) goals.push({ type: g[0], color: g[1], count: g[2] });
    } else {
      if (!goals.length && !colorGoals) colorGoals = 2;
      const palette = [];
      for (let c = 0; c < colors; c++) palette.push(c);
      for (let i = palette.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [palette[i], palette[j]] = [palette[j], palette[i]]; }
      const pure = !goals.length;
      const per = colorGoals === 1 ? 28 + d * 40 : colorGoals === 2 ? (pure ? 45 + d * 35 : 22 + d * 28) : (pure ? 34 + d * 26 : 18 + d * 22);
      for (let k = 0; k < colorGoals && goals.length < 3; k++) {
        const early = Math.min(1, 0.55 + n / 70);
        const cnt = Math.max(10, Math.round((per + Math.min(n, 400) / 25) * early / 5) * 5);
        goals.push({ type: 'color', color: palette[k], count: cnt });
      }
    }

    const lvl = {
      n, kind, salt: salt | 0, rows, cols, top, bot, grid, colors, goals,
      relicMax: 2, style, tip: TIPS[n] || null, difficulty: d,
    };
    lvl.estimate = estimateMoves(lvl);
    return lvl;
  }

  // Rough effort estimate; the tuned table overrides it for levels 1..1500.
  function estimateMoves(L) {
    let effort = 0;
    for (const g of L.goals) {
      if (g.type === 'color') effort += g.count / 2.6;
      else if (g.type === 'relic') effort += g.count * 3.2;
      else {
        let hp = 0;
        for (const x of L.grid) {
          if (x.v) continue;
          if (g.type === 'moss') hp += x.moss;
          else if (g.type === 'lock') hp += x.lock;
          else if (x.b === g.type) hp += x.hp;
        }
        effort += g.type === 'stone' ? hp * 0.9 : hp / 1.7;
      }
    }
    return Math.max(14, Math.min(50, Math.round(effort * 0.85 + 10)));
  }

  function getLevel(n) {
    const tbl = root.CC_LEVEL_TABLE;
    const entry = tbl && tbl[n - 1];
    const salt = entry ? entry[1] : 0;
    const L = gen(n, salt);
    L.moves = entry ? entry[0] : Math.round(L.estimate * (L.kind ? 1.05 : 1.2));
    return L;
  }

  const api = { gen, getLevel, levelKind, estimateMoves, LEVEL_COUNT, COLOR_NAMES, TIPS };
  root.CCLevels = api;

<script>
/* Castle Cascade — procedural art. Every piece, blocker and icon is drawn
 * once per size into an offscreen canvas and reused. Coordinates inside a
 * draw function run from -1 to 1 around the centre. */
(function (root) {
  'use strict';

  const GEMS = [
    { base: '#ff3b55', light: '#ffa3b0', dark: '#9c0f2b', name: 'Ruby' },
    { base: '#2f86ff', light: '#a8d0ff', dark: '#173d9c', name: 'Sapphire' },
    { base: '#2fc95a', light: '#a6f5b7', dark: '#0f7230', name: 'Emerald' },
    { base: '#ffc41f', light: '#fff3a3', dark: '#b06d00', name: 'Topaz' },
    { base: '#a955ff', light: '#dfb7ff', dark: '#54169e', name: 'Amethyst' },
    { base: '#ff8124', light: '#ffc999', dark: '#a03f00', name: 'Amber' },
  ];

  const cache = new Map();

  function sprite(key, size, draw) {
    const k = key + '@' + size;
    let c = cache.get(k);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = Math.max(4, Math.round(size));
    const ctx = c.getContext('2d');
    ctx.translate(c.width / 2, c.height / 2);
    const s = c.width / 2;
    ctx.scale(s, s);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    draw(ctx);
    cache.set(k, c);

    const g = ctx.createLinearGradient(0, y0, 0, y1);
    stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
    return g;

      ctx.bezierCurveTo(0.92, -0.92, 1.05, 0.05, 0, 0.82);
    },
    (ctx) => { // teardrop
      ctx.moveTo(0, -0.92);
      ctx.bezierCurveTo(0.45, -0.42, 0.78, -0.02, 0.78, 0.3);
      ctx.arc(0, 0.3, 0.78, 0, Math.PI);
      ctx.bezierCurveTo(-0.78, -0.02, -0.45, -0.42, 0, -0.92);
    },
    (ctx) => { // emerald cut

      ctx.moveTo(-a, -b); ctx.lineTo(a, -b); ctx.lineTo(b, -a); ctx.lineTo(b, a);
      ctx.lineTo(a, b); ctx.lineTo(-a, b); ctx.lineTo(-b, a); ctx.lineTo(-b, -a);

    (ctx) => { // brilliant-cut diamond
      ctx.moveTo(-0.52, -0.72); ctx.lineTo(0.52, -0.72); ctx.lineTo(0.94, -0.18);
      ctx.lineTo(0, 0.94); ctx.lineTo(-0.94, -0.18);

    ctx.lineWidth = 0.1;
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';

      ctx.moveTo(-0.94, -0.18); ctx.lineTo(0.94, -0.18);

    ctx.translate(-0.3, -0.42);
    ctx.rotate(-0.55);

    ctx.ellipse(0, 0, 0.26, 0.12, 0, 0, Math.PI * 2);

    ctx.fill();

    ctx.beginPath(); ctx.arc(0.32, 0.28, 0.06, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
