<title>Castle Cascade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="css/game.css">

<div id="app">
  <section id="home" class="screen">
    <header class="topbar">
      <button class="pill" id="livesPill" aria-label="Lives">
        <img class="ic" alt="" data-icon="heart"><b id="livesNum">5</b><small id="livesTimer">Full</small>
      </button>
      <div class="pill"><img class="ic" alt="" data-icon="coin"><b id="coinsNum">0</b></div>
      <div class="pill"><img class="ic" alt="" data-icon="star"><b id="starsNum">0</b></div>
      <button class="avatarbtn" id="avatarBtn" aria-label="Profile">
        <span id="avatarSlot"></span><i class="dot" id="achDot" hidden></i>
      </button>
    </header>

    <div class="kingdom">
      <div class="areahead">
        <h1 id="areaName">Throne Hall</h1>
        <p id="areaSub">Area 1 · 0 of 6 restored</p>
        <div class="bar thin"><i id="areaFill"></i></div>
      </div>
      <div class="scene" id="scene"></div>
      <button class="btn build" id="buildBtn">Build</button>
    </div>

    <div class="widgets">
      <button class="widget" id="dailyBtn">
        <img class="ic md" alt="" data-icon="chest"><span>Daily gift</span><i class="dot" id="dailyDot"></i>
      </button>
      <button class="widget" id="chestBtn">
        <img class="ic md" alt="" data-icon="chest">
        <span class="wcol"><span>Level chest</span><span class="bar mini"><i id="chestFill"></i></span></span>
        <b id="chestProg">0/10</b>
      </button>
    </div>

    <div class="playwrap">
      <p class="streak" id="streak" hidden></p>
      <button class="btn play" id="playBtn"><span class="lbl">Level</span><span id="playNum">1</span></button>
      <p class="playtag" id="playTag" hidden></p>
    </div>
  </section>

  <section id="profile" class="screen" hidden>
    <header class="phead">
      <button class="roundbtn" id="profileBack" aria-label="Back to kingdom">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6a1.5 1.5 0 0 1 0 2.1L10.1 12l5.3 5.3a1.5 1.5 0 1 1-2.1 2.1l-6.4-6.3a1.5 1.5 0 0 1 0-2.2l6.4-6.3a1.5 1.5 0 0 1 2.1 0z"/></svg>
      </button>
      <h2>Profile</h2>
      <div class="pill"><img class="ic" alt="" data-icon="coin"><b id="pCoins">0</b></div>
      <button class="roundbtn" id="profileSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </header>
    <div class="pscroll" id="profileBody"></div>
  </section>

  <section id="game" class="screen" hidden>
    <canvas id="board"></canvas>
    <header class="hud">
      <button class="roundbtn" id="pauseBtn" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
      <div class="movesbox" id="movesBox"><small id="levelBadge">Level 1</small><b id="movesNum">0</b><small>moves</small></div>
      <div class="goals" id="goals"></div>
    </header>
    <p class="tipcard" id="tipCard" hidden></p>
    <p class="boosterhint" id="boosterHint" hidden></p>
    <footer class="boosters" id="boosterBar"></footer>
    <div class="banner" id="banner" hidden></div>
  </section>

  <div class="intro" id="intro">
    <canvas id="introFx" aria-hidden="true"></canvas>
    <svg class="castle" viewBox="0 -12 400 242" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>
        <linearGradient id="castleFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#43308a"/><stop offset="1" stop-color="#170f40"/>
        </linearGradient>
      </defs>
      <path d="M0 200 Q100 162 200 190 T400 184 V230 H0Z" fill="#1c1550"/>
      <g fill="url(#castleFill)" stroke="rgba(255,214,120,.28)" stroke-width="1.5">
        <rect x="58" y="96" width="50" height="134"/>
        <polygon points="52,98 83,40 114,98"/>
        <rect x="292" y="96" width="50" height="134"/>
        <polygon points="286,98 317,40 348,98"/>
        <rect x="108" y="140" width="184" height="90"/>
        <rect x="160" y="78" width="80" height="152"/>
        <polygon points="152,80 200,14 248,80"/>
        <path d="M110 128h12v14h-12zM132 128h12v14h-12zM254 128h12v14h-12zM276 128h12v14h-12z"/>
      </g>
      <path d="M184 230V198a16 16 0 0 1 32 0V230Z" fill="#0b0826"/>
      <g class="win" fill="#ffd36b">
        <rect x="76" y="118" width="14" height="20" rx="7"/><rect x="310" y="118" width="14" height="20" rx="7"/>
        <rect x="192" y="102" width="16" height="24" rx="8"/><rect x="128" y="164" width="10" height="16" rx="5"/>
        <rect x="262" y="164" width="10" height="16" rx="5"/><rect x="76" y="164" width="14" height="18" rx="7"/>
        <rect x="310" y="164" width="14" height="18" rx="7"/>
      </g>
      <g stroke="#ffcf3f" stroke-width="2" fill="#ff3b55">
        <path d="M83 40V20l16 5-16 5"/><path d="M317 40V20l16 5-16 5"/><path d="M200 14V-6l18 6-18 6"/>
      </g>
    </svg>
    <div class="logo">
      <span class="rays" aria-hidden="true"></span>
      <img class="crown" alt="" data-icon="relic">
      <h1 class="title" aria-label="Castle Cascade"><span class="word w1" aria-hidden="true">Castle</span><span class="word w2" aria-hidden="true">Cascade</span></h1>
      <p class="tagline">1,500 levels of royal puzzles</p>
    </div>
    <div class="introfoot">
      <div class="loadbar"><i></i></div>
      <p class="loadtxt">Polishing the gems…</p>
      <button class="btn green big tapplay" id="introPlay" hidden>Tap to play</button>
      <p class="legalnote">By playing you agree to the <button data-legal="terms">Terms of Service</button> and <button data-legal="privacy">Privacy Policy</button>.</p>
    </div>
  </div>

  <div class="legal" id="legalView" role="dialog" aria-modal="true" aria-labelledby="legalTitle" hidden>
    <header class="lhead">
      <button class="roundbtn" id="legalBack" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6a1.5 1.5 0 0 1 0 2.1L10.1 12l5.3 5.3a1.5 1.5 0 1 1-2.1 2.1l-6.4-6.3a1.5 1.5 0 0 1 0-2.2l6.4-6.3a1.5 1.5 0 0 1 2.1 0z"/></svg>
      </button>
      <h2 id="legalTitle">Privacy Policy</h2>
    </header>
    <nav class="ltabs" aria-label="Legal documents">
      <button data-legal="privacy">Privacy</button><button data-legal="terms">Terms</button><button data-legal="credits">Credits</button>
    </nav>
    <article class="lbody" id="legalBody"></article>
  </div>

  <div class="modal" id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/level-table.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/board.js"></script>
<script src="js/legal.js"></script>
<script>
  document.querySelectorAll('img[data-icon]').forEach(function (img) { img.src = CCArt.iconURL(img.dataset.icon); });
</script>
<script src="js/app.js"></script>
